services:
  # ── Redis（Celery broker + result backend）──────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── FastAPI API Server ────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      # 挂载模型权重（宿主机路径 → 容器内 /models）
      - ../results/S1_1bar_lora/checkpoint_best.pt:/models/S1_1bar_lora/checkpoint_best.pt:ro
      - ../paper_data/model/checkpoint_best.pt:/models/Tobacco_CH4_v2/checkpoint_best.pt:ro
      - ../Uni-MOF-main/lmdb_s1_fixed/dict.txt:/models/dict.txt:ro
      # 挂载 unimof 代码（方便调试时热更新）
      - ../Uni-MOF-main/unimof:/app/unimof:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Celery Worker（独立进程，负责实际推理）────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: >
      celery -A app.tasks.celery_app worker
      --loglevel=info
      --concurrency=2
      --pool=prefork
      -Q celery
    env_file: ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ../results/S1_1bar_lora/checkpoint_best.pt:/models/S1_1bar_lora/checkpoint_best.pt:ro
      - ../paper_data/model/checkpoint_best.pt:/models/Tobacco_CH4_v2/checkpoint_best.pt:ro
      - ../Uni-MOF-main/lmdb_s1_fixed/dict.txt:/models/dict.txt:ro
      - ../Uni-MOF-main/unimof:/app/unimof:ro
    depends_on:
      redis:
        condition: service_healthy

  # ── Celery Flower（任务监控 UI，可选）────────────────────────────────────
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: >
      celery -A app.tasks.celery_app flower
      --port=5555
    ports:
      - "5555:5555"
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - worker

  # ── React 前端（开发模式，生产用 nginx）──────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api
